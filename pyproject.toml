[project]
name = "platform-workflows"
version = "1.3.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14",
    "pyyaml>=6.0.3",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "ruff>=0.17",
    "pyright>=1.1.414",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "D", "UP", "B", "SIM", "C90", "PL", "ANN", "ERA", "BLE", "TRY", "S", "RUF", "PT", "RET", "ARG", "PTH", "DTZ", "T20"]
ignore = ["D203", "D213"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "PLR2004", "ANN"]
# Commands use argument lists with no shell; command names are fixed by these tools.
"tools/*.py" = ["S603", "S607"]

[tool.pyright]
include = ["tools", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
source = ["tools"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
