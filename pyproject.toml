[project]
name = "platform-workflows"
version = "1.11.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "ruff>=0.17",
    "pyright>=1.1.414",
    "types-pyyaml>=6.0.12.20260906",
    "pre-commit==4.6.0",
]

[tool.ruff]
extend = "ruff-base.toml"

[tool.ruff.lint]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "PLR2004", "ANN"]
# Commands use argument lists with no shell; command names are fixed by these tools.
"tools/*.py" = ["S603", "S607"]

[tool.pyright]
include = ["tools", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
source = ["tools"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
