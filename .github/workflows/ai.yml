name: Isolated advisory AI
on:
  workflow_call:
    inputs:
      mode:
        type: string
        required: true
    secrets:
      AI_API_KEY:
        required: false
      AI_TELEMETRY_SIGNING_KEY:
        required: false
      BOT_APP_ID:
        required: false
      BOT_APP_KEY:
        required: false
permissions: {}
concurrency:
  group: ai-${{ inputs.mode }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  analyze:
    name: Isolated analysis
    if: >-
      (github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
      (inputs.mode == 'review' && github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.id != 49699333)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
      issues: read
    outputs:
      ready: ${{ steps.available.outputs.ready }}
      evidence_artifact: ${{ steps.evidence.outputs.artifact-id }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Validate analysis mode
        env:
          MODE: ${{ inputs.mode }}
        run: |
          case "$MODE" in review|audit|fix|standards) ;; *) exit 1 ;; esac
      - name: Check credential availability
        id: available
        env:
          AI_KEY: ${{ secrets.AI_API_KEY }}
          BOT_ID: ${{ secrets.BOT_APP_ID }}
          BOT_KEY: ${{ secrets.BOT_APP_KEY }}
          MODE: ${{ inputs.mode }}
        run: |
          ready=true
          if [ -z "$AI_KEY" ]; then ready=false; fi
          if [ "$MODE" = fix ] || [ "$MODE" = standards ]; then
            if [ -z "$BOT_ID" ] || [ -z "$BOT_KEY" ]; then ready=false; fi
          fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if [ "$ready" = false ]; then
            echo 'AI step skipped: required API/App credentials are not configured.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.available.outputs.ready == 'true'
        with:
          path: repository
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified secret scanner
        if: steps.available.outputs.ready == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl --fail --location --silent --show-error https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar --extract --gzip --file "$RUNNER_TEMP/gitleaks.tar.gz" --directory "$RUNNER_TEMP/gitleaks"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.available.outputs.ready == 'true'
        with:
          repository: Abdel-Abdelaal/platform-workflows
          ref: 542725492f2a90e73be2f50036ffc3b7c43ae777 # reviewed telemetry tooling
          path: platform
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.available.outputs.ready == 'true'
        with:
          repository: Abdel-Abdelaal/.github
          ref: main # protected handbook data; never executed
          path: handbook
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: steps.available.outputs.ready == 'true'
        with:
          version: '0.13.0'
          python-version: '3.12'
      - name: Install locked tooling
        if: steps.available.outputs.ready == 'true'
        working-directory: platform
        run: |
          uv sync --locked --no-dev
          npm ci --no-audit --no-fund
          echo "$GITHUB_WORKSPACE/platform/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Prepare coding context
        if: steps.available.outputs.ready == 'true'
        working-directory: platform
        env:
          MODE: ${{ inputs.mode }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ "$MODE" = review ]; then
            [[ "$BASE_SHA" =~ ^[a-f0-9]{40}$ ]] && [[ "$HEAD_SHA" =~ ^[a-f0-9]{40}$ ]]
            git -C "$GITHUB_WORKSPACE/repository" diff --no-ext-diff --no-textconv "$BASE_SHA" "$HEAD_SHA" -- > "$RUNNER_TEMP/pr.diff"
          else
            touch "$RUNNER_TEMP/pr.diff"
          fi
          uv run --locked --no-dev python -m tools.ai_context --repository "$GITHUB_WORKSPACE/repository" --handbook "$GITHUB_WORKSPACE/handbook" --diff "$RUNNER_TEMP/pr.diff" --output "$RUNNER_TEMP/context.md" --manifest "$RUNNER_TEMP/context-manifest.json"
          echo "HANDBOOK_SHA=$(git -C "$GITHUB_WORKSPACE/handbook" rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "SOURCE_CHECKOUT_SHA=$(git -C "$GITHUB_WORKSPACE/repository" rev-parse HEAD)" >> "$GITHUB_ENV"
          if [ "$MODE" = fix ]; then
            gh issue list --state open --label governance --search '"Weekly health report" in:title' --json title,body > "$RUNNER_TEMP/health-report.json"
            head -c 20000 "$RUNNER_TEMP/health-report.json" >> "$RUNNER_TEMP/context.md"
          fi
          if [ "$MODE" = standards ]; then
            uv run --locked --no-dev python -m tools.standards_context --output "$RUNNER_TEMP/context.md"
          fi
      - name: Scan the complete prepared model input
        id: input-scan
        if: steps.available.outputs.ready == 'true'
        env:
          MODE: ${{ inputs.mode }}
        run: |
          mkdir -p "$RUNNER_TEMP/model-input"
          cp "$RUNNER_TEMP/context.md" "$RUNNER_TEMP/pr.diff" "$RUNNER_TEMP/model-input/"
          prompt="$MODE"
          if [ "$MODE" = standards ]; then prompt=standards-review; fi
          cp "$GITHUB_WORKSPACE/platform/prompts/$prompt.md" "$RUNNER_TEMP/model-input/prompt.md"
          "$RUNNER_TEMP/gitleaks/gitleaks" dir "$RUNNER_TEMP/model-input" --redact --no-banner --exit-code 1
      - name: Analyze with tool-denied Flash model
        if: steps.available.outputs.ready == 'true'
        working-directory: platform
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_BASE_URL: ${{ vars.AI_BASE_URL || 'https://token-plan-ams.xiaomimimo.com/v1' }}
          AI_OUTPUT_SECRET_SCANNER: ${{ runner.temp }}/gitleaks/gitleaks
          MODE: ${{ inputs.mode }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PLATFORM_RELEASE: v1.10.0
          TOOLING_COMMIT: 542725492f2a90e73be2f50036ffc3b7c43ae777
        run: |
          prompt="$MODE"
          if [ "$MODE" = standards ]; then prompt=standards-review; fi
          # Whole-repository modes turn reasoning off so the completion budget
          # reaches the JSON answer (see docs/ai.md); diff review keeps it on.
          thinking=disabled
          if [ "$MODE" = review ]; then thinking=enabled; fi
          uv run --locked --no-dev python -m tools.ai_runner --context "$RUNNER_TEMP/context.md" --prompt "prompts/$prompt.md" --output "$RUNNER_TEMP/analysis.json" --thinking "$thinking" --record "$RUNNER_TEMP/ai-record.json" --manifest "$RUNNER_TEMP/context-manifest.json" --diff "$RUNNER_TEMP/pr.diff"
      - name: Secret-scan model evidence before any upload
        id: evidence-scan
        if: always() && steps.available.outputs.ready == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/model-evidence"
          if [ -f "$RUNNER_TEMP/ai-record.json" ]; then
            cp "$RUNNER_TEMP/ai-record.json" "$RUNNER_TEMP/model-evidence/"
          fi
          if [ -f "$RUNNER_TEMP/analysis.json" ]; then
            cp "$RUNNER_TEMP/analysis.json" "$RUNNER_TEMP/model-evidence/"
          fi
          "$RUNNER_TEMP/gitleaks/gitleaks" dir "$RUNNER_TEMP/model-evidence" --redact --no-banner --exit-code 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: evidence
        if: always() && steps.evidence-scan.outcome == 'success'
        with:
          name: ai-evidence-${{ inputs.mode }}-${{ github.run_id }}-${{ github.run_attempt }}-analysis
          path: ${{ runner.temp }}/ai-record.json
          if-no-files-found: ignore
          retention-days: 90
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success() && steps.evidence-scan.outcome == 'success'
        with:
          name: ai-result-${{ inputs.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/analysis.json
            ${{ runner.temp }}/pr.diff
          retention-days: 1
  publish-review:
    name: Publish advisory notices
    needs: analyze
    if: needs.analyze.outputs.ready == 'true' && inputs.mode == 'review'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      checks: write
    outputs:
      receipt_artifact: ${{ steps.receipt.outputs.artifact-id }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Abdel-Abdelaal/platform-workflows
          ref: 542725492f2a90e73be2f50036ffc3b7c43ae777 # reviewed telemetry tooling
          path: platform
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
          python-version: '3.12'
      - run: uv sync --locked --no-dev
        working-directory: platform
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ai-result-${{ inputs.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: analysis
      - name: Publish validated findings
        working-directory: platform
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: uv run --locked --no-dev python -m tools.ai_publish --mode review --repository "$GH_REPO" --number "$PR_NUMBER" --head-sha "$HEAD_SHA" --analysis "$GITHUB_WORKSPACE/analysis/analysis.json" --diff "$GITHUB_WORKSPACE/analysis/pr.diff" --receipt "$RUNNER_TEMP/publication.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: receipt
        if: always()
        with:
          name: ai-evidence-${{ inputs.mode }}-${{ github.run_id }}-${{ github.run_attempt }}-publication
          path: ${{ runner.temp }}/publication.json
          if-no-files-found: ignore
          retention-days: 90
  publish-audit:
    name: Publish weekly health report
    concurrency:
      group: ai-audit-publish-${{ github.repository }}
      cancel-in-progress: false
    needs: analyze
    if: needs.analyze.outputs.ready == 'true' && inputs.mode == 'audit'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    outputs:
      receipt_artifact: ${{ steps.receipt.outputs.artifact-id }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Abdel-Abdelaal/platform-workflows
          ref: 542725492f2a90e73be2f50036ffc3b7c43ae777 # reviewed telemetry tooling
          path: platform
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
          python-version: '3.12'
      - run: uv sync --locked --no-dev
        working-directory: platform
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ai-result-${{ inputs.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: analysis
      - name: Maintain one health report
        working-directory: platform
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: uv run --locked --no-dev python -m tools.ai_publish --mode audit --repository "$GH_REPO" --analysis "$GITHUB_WORKSPACE/analysis/analysis.json" --receipt "$RUNNER_TEMP/publication.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: receipt
        if: always()
        with:
          name: ai-evidence-${{ inputs.mode }}-${{ github.run_id }}-${{ github.run_attempt }}-publication
          path: ${{ runner.temp }}/publication.json
          if-no-files-found: ignore
          retention-days: 90
  validate-fix:
    name: Test proposed patch without provider or App credentials
    needs: analyze
    if: needs.analyze.outputs.ready == 'true' && (inputs.mode == 'fix' || inputs.mode == 'standards')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.patch.outputs.changed }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repository
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Abdel-Abdelaal/platform-workflows
          ref: 542725492f2a90e73be2f50036ffc3b7c43ae777 # reviewed telemetry tooling
          path: platform
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
          python-version: '3.12'
      - run: uv sync --locked --no-dev
        working-directory: platform
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ai-result-${{ inputs.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: analysis
      - name: Validate and apply bounded patch
        id: patch
        working-directory: platform
        env:
          MODE: ${{ inputs.mode }}
        run: |
          extra=()
          if [ "$MODE" = standards ]; then extra=(--standards-only); fi
          uv run --locked --no-dev python -m tools.ai_patch --analysis "$GITHUB_WORKSPACE/analysis/analysis.json" --repository "$GITHUB_WORKSPACE/repository" --output "$RUNNER_TEMP/validated.patch" "${extra[@]}"
          if [ -s "$RUNNER_TEMP/validated.patch" ]; then echo 'changed=true' >> "$GITHUB_OUTPUT"; else echo 'changed=false' >> "$GITHUB_OUTPUT"; fi
      - name: Test candidate with no AI or App key
        if: steps.patch.outputs.changed == 'true'
        working-directory: repository
        run: |
          git diff --check
          if [ -f pyproject.toml ]; then
            uv sync --locked
            uv run ruff format --check .
            uv run ruff check .
            uv run pyright
            uv run pytest --cov --cov-branch --cov-fail-under=90
          elif [ -d tests ]; then
            python -m unittest discover -s tests -v
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.patch.outputs.changed == 'true'
        with:
          name: validated-ai-patch-${{ inputs.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/validated.patch
          retention-days: 1
  propose-fix:
    name: Open one draft fix PR
    needs: [analyze, validate-fix]
    if: needs.validate-fix.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      receipt_artifact: ${{ steps.receipt.outputs.artifact-id }}
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repository
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Abdel-Abdelaal/platform-workflows
          ref: 542725492f2a90e73be2f50036ffc3b7c43ae777 # reviewed telemetry tooling
          path: platform
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
          python-version: '3.12'
      - run: uv sync --locked --no-dev
        working-directory: platform
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ai-result-${{ inputs.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: analysis
      - name: Apply validated proposal without running source
        working-directory: platform
        env:
          MODE: ${{ inputs.mode }}
        run: |
          extra=()
          if [ "$MODE" = standards ]; then extra=(--standards-only); fi
          uv run --locked --no-dev python -m tools.ai_patch --analysis "$GITHUB_WORKSPACE/analysis/analysis.json" --repository "$GITHUB_WORKSPACE/repository" --output "$RUNNER_TEMP/proposal.patch" --body "$RUNNER_TEMP/ai-pr.md" "${extra[@]}"
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_KEY }}
          owner: Abdel-Abdelaal
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        id: proposal
        with:
          token: ${{ steps.app.outputs.token }}
          path: repository
          branch: ${{ inputs.mode == 'standards' && 'bot/ai-standards' || 'bot/ai-fix' }}
          base: ${{ github.event.repository.default_branch }}
          draft: true
          delete-branch: true
          title: >-
            ${{ inputs.mode == 'standards' && 'docs: propose handbook maintenance' || 'fix: address weekly health finding' }}
          body-path: ${{ runner.temp }}/ai-pr.md
          labels: ai-generated
          commit-message: |
            fix: propose bounded AI maintenance

            Co-Authored-By: MiMo 2.6 Flash <noreply@xiaomi.com>
          add-paths: |
            src/**
            tests/**
            docs/**
            standards/**
            README.md
      - name: Record draft proposal coordinates
        env:
          PR_NUMBER: ${{ steps.proposal.outputs.pull-request-number }}
          PR_URL: ${{ steps.proposal.outputs.pull-request-url }}
          OPERATION: ${{ steps.proposal.outputs.pull-request-operation }}
        run: |
          jq -n '{status: "proposal_processed", number: env.PR_NUMBER, url: env.PR_URL, operation: env.OPERATION}' > "$RUNNER_TEMP/publication.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        id: receipt
        with:
          name: ai-evidence-${{ inputs.mode }}-${{ github.run_id }}-${{ github.run_attempt }}-publication
          path: ${{ runner.temp }}/publication.json
          retention-days: 90
  telemetry:
    name: Sign and archive AI evidence
    needs: [analyze, publish-review, publish-audit, validate-fix, propose-fix]
    if: >-
      always() && !cancelled() &&
      ((github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)) ||
        (github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.id != 49699333))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Abdel-Abdelaal/platform-workflows
          ref: 542725492f2a90e73be2f50036ffc3b7c43ae777 # reviewed telemetry tooling
          path: platform
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
          python-version: '3.12'
      - run: uv sync --locked --no-dev
        working-directory: platform
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.analyze.outputs.evidence_artifact != ''
        with:
          artifact-ids: ${{ needs.analyze.outputs.evidence_artifact }}
          path: evidence
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.publish-review.outputs.receipt_artifact != '' || needs.publish-audit.outputs.receipt_artifact != '' || needs.propose-fix.outputs.receipt_artifact != ''
        with:
          artifact-ids: ${{ needs.publish-review.outputs.receipt_artifact || needs.publish-audit.outputs.receipt_artifact || needs.propose-fix.outputs.receipt_artifact }}
          path: evidence
          merge-multiple: true
      - name: Join evidence without executing analyzed source
        working-directory: platform
        env:
          MODE: ${{ inputs.mode }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PLATFORM_RELEASE: v1.10.0
          TOOLING_COMMIT: 542725492f2a90e73be2f50036ffc3b7c43ae777
          ANALYZE_RESULT: ${{ needs.analyze.result }}
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: uv run --locked --no-dev python -m tools.ai_telemetry_archive finalize --directory "$GITHUB_WORKSPACE/evidence" --record "$RUNNER_TEMP/ai-record.json"
      - name: Secret-scan final evidence before publication
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks" "$RUNNER_TEMP/ai-evidence-scan"
          curl --fail --location --silent --show-error https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar --extract --gzip --file "$RUNNER_TEMP/gitleaks.tar.gz" --directory "$RUNNER_TEMP/gitleaks"
          cp "$RUNNER_TEMP/ai-record.json" "$RUNNER_TEMP/predicate.json" "$RUNNER_TEMP/ai-evidence-scan/"
          "$RUNNER_TEMP/gitleaks/gitleaks" dir "$RUNNER_TEMP/ai-evidence-scan" --redact --no-banner --exit-code 1
      - name: Attest complete record
        id: attest
        if: github.event.repository.visibility == 'public'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/ai-record.json
          predicate-type: https://github.com/Abdel-Abdelaal/platform-workflows/blob/main/docs/ai-telemetry.md#record-v1
          predicate-path: ${{ runner.temp }}/predicate.json
          create-storage-record: false
      - name: Read the private repository's reviewed signing trust anchor
        if: github.event.repository.visibility == 'private'
        working-directory: platform
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run --locked --no-dev python - <<'PY'
          import base64
          import os
          from pathlib import Path
          from urllib.parse import quote
          from tools.github_api import github_api

          repository = os.environ["GITHUB_REPOSITORY"]
          metadata = github_api(f"repos/{repository}")
          if metadata["private"] is not True:
              raise SystemExit("Private signing policy requires private repository storage.")
          branch = quote(metadata["default_branch"], safe="")
          reference = github_api(f"repos/{repository}/git/ref/heads/{branch}")
          commit = reference["object"]["sha"]
          policy = github_api(f"repos/{repository}/contents/.github/ai-telemetry-public.pem?ref={commit}")
          if policy["type"] != "file" or policy["encoding"] != "base64" or policy["size"] > 16384:
              raise SystemExit("Invalid private signing trust anchor.")
          target = Path(os.environ["RUNNER_TEMP"]) / "signing-policy"
          target.mkdir(mode=0o700)
          (target / "public.pem").write_bytes(base64.b64decode(policy["content"]))
          PY
      - name: Sign private evidence and verify its reviewed trust anchor
        id: private-sign
        if: github.event.repository.visibility == 'private'
        working-directory: platform
        env:
          AI_TELEMETRY_SIGNING_KEY: ${{ secrets.AI_TELEMETRY_SIGNING_KEY }}
        run: |
          uv run --locked --no-dev python -m tools.ai_private_sign sign --record "$RUNNER_TEMP/ai-record.json" --bundle "$RUNNER_TEMP/ai-record.dsse.json"
          uv run --locked --no-dev python -m tools.ai_private_sign verify --record "$RUNNER_TEMP/ai-record.json" --bundle "$RUNNER_TEMP/ai-record.dsse.json" --public-key "$RUNNER_TEMP/signing-policy/public.pem"
          echo "bundle_path=$RUNNER_TEMP/ai-record.dsse.json" >> "$GITHUB_OUTPUT"
      - name: Archive signed record durably in this repository
        working-directory: platform
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.mode }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path || steps.private-sign.outputs.bundle_path }}
          SIGNATURE_FORMAT: ${{ github.event.repository.visibility == 'private' && 'dsse' || 'sigstore' }}
          REPOSITORY_VISIBILITY: ${{ github.event.repository.visibility }}
        run: uv run --locked --no-dev python -m tools.ai_telemetry_archive archive --record "$RUNNER_TEMP/ai-record.json" --bundle "$BUNDLE" --signature-format "$SIGNATURE_FORMAT" --directory "$RUNNER_TEMP/signed-ai-records"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && (steps.attest.outcome == 'success' || steps.private-sign.outcome == 'success')
        with:
          name: ai-telemetry-${{ inputs.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ai-record.json
            ${{ steps.attest.outputs.bundle-path || steps.private-sign.outputs.bundle_path }}
          retention-days: 90

  report:
    needs: [analyze, publish-review, publish-audit, validate-fix, propose-fix, telemetry]
    if: failure() && github.event_name == 'schedule'
    uses: ./.github/workflows/report-failure.yml
    permissions:
      issues: write
    with:
      title: Scheduled advisory AI failed
