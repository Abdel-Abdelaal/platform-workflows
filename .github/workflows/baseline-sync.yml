name: Propose shared baseline updates
on:
  workflow_call:
    secrets:
      BOT_APP_ID:
        required: false
      BOT_APP_KEY:
        required: false
permissions: {}
concurrency:
  group: baseline-${{ github.repository }}
  cancel-in-progress: false
jobs:
  sync:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Check automation credentials
        id: available
        env:
          BOT_ID: ${{ secrets.BOT_APP_ID }}
          BOT_KEY: ${{ secrets.BOT_APP_KEY }}
        run: |
          ready=false
          if [ -n "$BOT_ID" ] && [ -n "$BOT_KEY" ]; then ready=true; fi
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if [ "$ready" = false ]; then
            echo 'Baseline PR skipped: automation App credentials are not configured.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.available.outputs.ready == 'true'
        with:
          ref: main
          path: repository
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.available.outputs.ready == 'true'
        with:
          repository: Abdel-Abdelaal/.github
          ref: main # reviewed baseline data; never executed by this job
          path: standards
          sparse-checkout: baseline
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.available.outputs.ready == 'true'
        with:
          repository: Abdel-Abdelaal/platform-workflows
          ref: 65804da81d0c45b9768b40dfb54d8452b81cae8d # reviewed tooling through PR 20
          path: platform
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        if: steps.available.outputs.ready == 'true'
        with:
          version: '0.13.0'
          python-version: '3.12'
      - name: Prepare only allowlisted baseline changes
        if: steps.available.outputs.ready == 'true'
        working-directory: platform
        run: uv run --locked --no-dev python -m tools.baseline "$GITHUB_WORKSPACE/standards/baseline" "$GITHUB_WORKSPACE/repository" --apply
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        if: steps.available.outputs.ready == 'true'
        id: app
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_KEY }}
          owner: Abdel-Abdelaal
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        if: steps.available.outputs.ready == 'true'
        with:
          token: ${{ steps.app.outputs.token }}
          path: repository
          branch: bot/baseline-sync
          base: main
          delete-branch: true
          title: 'chore: sync baseline files'
          commit-message: 'chore: sync baseline files'
          body: |
            Copy the reviewed common baseline through the fixed managed-file allowlist.
            Exact exceptions are recorded in `.baseline-ignore`. Normal required checks
            and review apply; this automation cannot merge.

            Generated by baseline synchronization.
          add-paths: |
            .gitattributes
            .editorconfig
            ruff-base.toml
            pyrightconfig.base.json
            .pre-commit-config.yaml
            opencode.json
            .github/workflows/scorecard.yml
            labels.yml
  report:
    needs: sync
    if: failure() && github.event_name == 'schedule'
    uses: ./.github/workflows/report-failure.yml
    permissions:
      issues: write
    with:
      title: Scheduled baseline synchronization failed
