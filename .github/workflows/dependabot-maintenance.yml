name: Public fleet dependency maintenance
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      apply:
        description: Squash eligible updates through normal protection
        type: boolean
        default: false
permissions: {}
concurrency:
  group: public-fleet-dependency-maintenance
  cancel-in-progress: false
jobs:
  maintain:
    if: github.repository == 'Abdel-Abdelaal/platform-workflows' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
          python-version: '3.12'
      - name: Inspect public repositories without write credentials
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --locked --no-dev python -m tools.dependabot_merge --output "$RUNNER_TEMP/dependency-plan.json"
      - name: Restrict App access to discovered public repositories
        id: targets
        env:
          BOT_ID: ${{ secrets.BOT_APP_ID }}
          BOT_KEY: ${{ secrets.BOT_APP_KEY }}
        run: |
          uv run --locked --no-dev python - <<'PY'
          import json
          import os
          from pathlib import Path
          plan = json.loads((Path(os.environ['RUNNER_TEMP']) / 'dependency-plan.json').read_text())
          names = sorted(name.split('/')[1] for name in plan['repositories'])
          ready = bool(os.environ['BOT_ID'] and os.environ['BOT_KEY'] and names)
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write('repositories=' + ','.join(names) + '\n')
              output.write('ready=' + str(ready).lower() + '\n')
          if not ready:
              with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as summary:
                  summary.write('Read-only plan retained; maintenance App setup or public targets missing.\n')
          PY
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app
        if: steps.targets.outputs.ready == 'true' && (github.event_name == 'schedule' || inputs.apply)
        with:
          app-id: ${{ secrets.BOT_APP_ID }}
          private-key: ${{ secrets.BOT_APP_KEY }}
          owner: Abdel-Abdelaal
          repositories: ${{ steps.targets.outputs.repositories }}
          permission-contents: write
          permission-pull-requests: write
          permission-workflows: write
      - name: Squash authenticated compatible updates through protection
        if: steps.app.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: uv run --locked --no-dev python -m tools.dependabot_merge --apply --output "$RUNNER_TEMP/dependency-result.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: public-dependency-maintenance
          path: ${{ runner.temp }}/dependency-*.json
          if-no-files-found: error
          retention-days: 30
  report:
    needs: maintain
    if: failure() && github.event_name == 'schedule'
    uses: ./.github/workflows/report-failure.yml
    permissions:
      issues: write
    with:
      title: Scheduled public dependency maintenance failed
