name: ai-audit
on:
  workflow_call:
    secrets:
      AI_API_KEY:
        required: false
      AI_TELEMETRY_SIGNING_KEY:
        required: false
      BOT_APP_ID:
        required: false
      BOT_APP_KEY:
        required: false
permissions: {}
jobs:
  ai:
    uses: ./.github/workflows/ai.yml
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
      issues: write
      pull-requests: write
      checks: write
    with:
      mode: audit
    secrets:
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
      AI_TELEMETRY_SIGNING_KEY: ${{ secrets.AI_TELEMETRY_SIGNING_KEY }}
      BOT_APP_ID: ${{ secrets.BOT_APP_ID }}
      BOT_APP_KEY: ${{ secrets.BOT_APP_KEY }}
