name: Python CI
on:
  workflow_call:
    inputs:
      python-version:
        type: string
        default: '3.12'
      coverage-min:
        type: number
        default: 90
    secrets:
      SONAR_TOKEN:
        required: false
permissions: {}
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
          enable-cache: true
          python-version: ${{ inputs.python-version }}
      - run: uv sync --locked
      - run: |
          uv run ruff format --check .
          uv run ruff check --output-format=github .
      # Each tool runs when the caller lists it as a dev dependency, so adopting
      # one is a pyproject change in that repo, not a new workflow input.
      - name: Architecture, dependency and dead-code checks
        run: |
          run_if_installed() {
            if uv run --no-sync python -c 'import shutil, sys; sys.exit(shutil.which(sys.argv[1]) is None)' "$1"; then
              echo "::group::$*"
              uv run --no-sync "$@"
              echo "::endgroup::"
            else
              echo "Skipped $1: not in this project's dev dependencies." >> "$GITHUB_STEP_SUMMARY"
            fi
          }
          run_if_installed lint-imports
          run_if_installed deptry .
          run_if_installed vulture
      - name: Duplicated code (jscpd, at most 3%)
        run: |
          if [ -d src ]; then
            npx --yes jscpd@5.4.1 --threshold 3 --min-lines 5 --reporters console src
          else
            echo "Skipped jscpd: no src/ directory." >> "$GITHUB_STEP_SUMMARY"
          fi
  types:
    name: Types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
          enable-cache: true
          python-version: ${{ inputs.python-version }}
      - run: uv sync --locked
      - run: |
          uv run pyright
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
          enable-cache: true
          python-version: ${{ inputs.python-version }}
      - run: uv sync --locked
      - name: Test with branch coverage
        env:
          COVERAGE_MIN: ${{ inputs.coverage-min }}
        run: |
          uv run pytest --cov --cov-branch --cov-report=xml --cov-report=term-missing --cov-fail-under="$COVERAGE_MIN"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage.xml
          retention-days: 7
      - name: Sonar availability
        id: sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "$SONAR_TOKEN" ] && [ -f sonar-project.properties ]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo 'Sonar analysis skipped: token or verified project configuration missing.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        if: steps.sonar.outputs.run == 'true' && github.actor != 'dependabot[bot]'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  audit:
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: '0.13.0'
          enable-cache: true
          python-version: ${{ inputs.python-version }}
      - run: uv sync --locked
      - run: |
          uv export --locked --no-hashes --no-emit-project --format requirements-txt -o requirements-audit.txt
          uvx pip-audit@2.10.1 -r requirements-audit.txt --strict --progress-spinner off
      # Advisory second source: OSV aggregates more advisory databases than
      # pip-audit's PyPI feed. pip-audit stays the blocking gate.
      - name: Second advisory source (OSV-Scanner)
        id: osv
        continue-on-error: true
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --lockfile=uv.lock
      - name: Record OSV result
        if: always()
        env:
          OSV_OUTCOME: ${{ steps.osv.outcome }}
        run: |
          if [ "$OSV_OUTCOME" = success ]; then
            echo "OSV-Scanner: no known vulnerabilities in uv.lock." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::OSV-Scanner reported findings or failed; see the step log. Advisory only."
            echo "OSV-Scanner: findings or error (advisory). pip-audit remains the gate." >> "$GITHUB_STEP_SUMMARY"
          fi
