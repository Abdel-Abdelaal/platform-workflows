# One lint gate for every language a repository contains, using super-linter
# (slim image: ktlint, ESLint, ShellCheck, shfmt, hadolint, tflint,
# yamllint, markdownlint, ruff and more). It picks linters per file type.
#
# Pull requests lint only the files they change, so inherited code doesn't block
# new work. A full scan (scheduled callers) reports the backlog without failing.
name: Lint
on:
  workflow_call:
    inputs:
      full-scan:
        description: Lint every file and report without failing (for schedules).
        type: boolean
        default: false
      exclude:
        description: Regular expression of paths to skip, such as vendored code.
        type: string
        default: ''
permissions: {}
jobs:
  lint:
    name: Lint (all languages)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: super-linter/super-linter/slim@2da136927bd4a73596db63044b504547c62cb854 # v9.0.0
        continue-on-error: ${{ inputs.full-scan }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          VALIDATE_ALL_CODEBASE: ${{ inputs.full-scan }}
          FILTER_REGEX_EXCLUDE: ${{ inputs.exclude }}
          MULTI_STATUS: 'false'
          # The job has read-only permissions, so it can't post a PR comment.
          ENABLE_GITHUB_PULL_REQUEST_SUMMARY_COMMENT: 'false'
          # Formatting style belongs to each repository's own toolchain, and Biome
          # and Trivy scan the whole workspace even on pull requests, so they would
          # fail every PR on inherited code. Dependencies and IaC are scanned by
          # OSV-Scanner and CodeQL in security; JS/TS lint runs the project's own
          # lint script in node-ci.
          VALIDATE_BIOME_FORMAT: 'false'
          VALIDATE_BIOME_LINT: 'false'
          VALIDATE_TRIVY: 'false'
          VALIDATE_CSS_PRETTIER: 'false'
          VALIDATE_GRAPHQL_PRETTIER: 'false'
          VALIDATE_HTML_PRETTIER: 'false'
          VALIDATE_JAVASCRIPT_PRETTIER: 'false'
          VALIDATE_JSON_PRETTIER: 'false'
          VALIDATE_JSONC_PRETTIER: 'false'
          VALIDATE_JSX_PRETTIER: 'false'
          VALIDATE_MARKDOWN_PRETTIER: 'false'
          VALIDATE_TSX_PRETTIER: 'false'
          VALIDATE_TYPESCRIPT_PRETTIER: 'false'
          VALIDATE_VUE_PRETTIER: 'false'
          VALIDATE_YAML_PRETTIER: 'false'
          # Covered elsewhere with fleet-specific settings, so not duplicated here:
          # Python formatting/typing (ruff + Pyright in python-ci), secrets
          # (gitleaks in security), workflows (actionlint + zizmor in security),
          # IaC (Trivy), duplication (jscpd in python-ci).
          VALIDATE_PYTHON_BLACK: 'false'
          VALIDATE_PYTHON_FLAKE8: 'false'
          VALIDATE_PYTHON_ISORT: 'false'
          VALIDATE_PYTHON_MYPY: 'false'
          VALIDATE_PYTHON_PYLINT: 'false'
          VALIDATE_PYTHON_PYINK: 'false'
          VALIDATE_GITLEAKS: 'false'
          VALIDATE_GITHUB_ACTIONS: 'false'
          VALIDATE_GITHUB_ACTIONS_ZIZMOR: 'false'
          VALIDATE_CHECKOV: 'false'
          VALIDATE_JSCPD: 'false'
