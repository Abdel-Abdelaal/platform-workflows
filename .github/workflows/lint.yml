# One lint gate for every language a repository contains, using super-linter
# (slim image: ktlint, ESLint, Prettier, ShellCheck, shfmt, hadolint, tflint,
# yamllint, markdownlint, ruff and more). It picks linters per file type.
#
# Pull requests lint only the files they change, so inherited code doesn't block
# new work. A full scan (scheduled callers) reports the backlog without failing.
name: Lint
on:
  workflow_call:
    inputs:
      full-scan:
        description: Lint every file and report without failing (for schedules).
        type: boolean
        default: false
      exclude:
        description: Regular expression of paths to skip, such as vendored code.
        type: string
        default: ''
permissions: {}
jobs:
  lint:
    name: Lint (all languages)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: super-linter/super-linter/slim@2da136927bd4a73596db63044b504547c62cb854 # v9.0.0
        continue-on-error: ${{ inputs.full-scan }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          VALIDATE_ALL_CODEBASE: ${{ inputs.full-scan }}
          FILTER_REGEX_EXCLUDE: ${{ inputs.exclude }}
          MULTI_STATUS: 'false'
          # Covered elsewhere with fleet-specific settings, so not duplicated here:
          # Python formatting/typing (ruff + Pyright in python-ci), secrets
          # (gitleaks in security), workflows (actionlint + zizmor in security),
          # IaC (Trivy), duplication (jscpd in python-ci).
          VALIDATE_PYTHON_BLACK: 'false'
          VALIDATE_PYTHON_FLAKE8: 'false'
          VALIDATE_PYTHON_ISORT: 'false'
          VALIDATE_PYTHON_MYPY: 'false'
          VALIDATE_PYTHON_PYLINT: 'false'
          VALIDATE_PYTHON_PYINK: 'false'
          VALIDATE_GITLEAKS: 'false'
          VALIDATE_GITHUB_ACTIONS: 'false'
          VALIDATE_GITHUB_ACTIONS_ZIZMOR: 'false'
          VALIDATE_CHECKOV: 'false'
          VALIDATE_JSCPD: 'false'
